; VoiceShield — dialplan (Asterisk 20 LTS).
;
; Two contexts, two milestones:
;   [internal-direct]  TEST 1: pure SIP 100 <-> 101. No VoiceShield, no ARI.
;   [internal]         TEST 2: same calls, but each leg first enters the
;                      Stasis(voiceshield) app so the VoiceShield ARI
;                      controller can attach a passive tap (snoop + RTP to
;                      the existing telephony ingress) and then return the
;                      channel to Dial. The call itself is NEVER torn down by
;                      VoiceShield (detect-only milestone).
;
; IMPORTANT: [internal] requires the VoiceShield ARI controller to be
; connected (POST /api/v1/telephony/ari/connect). With no ARI app
; subscribed, Stasis() fails the call — use [internal-direct] until then.
; Point extensions at [internal] by changing their endpoint `context=`.

[general]
static = yes
writeprotect = no
autofallthrough = yes

[internal-direct]
exten => 100,1,NoOp(Direct call to extension 100)
 same => n,Dial(PJSIP/100,30)
 same => n,Hangup()
exten => 101,1,NoOp(Direct call to extension 101)
 same => n,Dial(PJSIP/101,30)
 same => n,Hangup()

[internal]
exten => 100,1,NoOp(VoiceShield-tapped call to extension 100)
 same => n,Stasis(voiceshield)
 same => n,Dial(PJSIP/100,30)
 same => n,Hangup()
exten => 101,1,NoOp(VoiceShield-tapped call to extension 101)
 same => n,Stasis(voiceshield)
 same => n,Dial(PJSIP/101,30)
 same => n,Hangup()

; --- Future PSTN/trunk inbound (documentation only, disabled) -------------
; Wire provider DIDs here only after a real trunk is provisioned and tested.
; Inbound calls MUST enter Stasis(voiceshield) before Dial so analysis can
; attach; the VoiceShield gateway must be in the media path (RTP via
; externalMedia, see docs/telephony-architecture.md). Never route a DID
; directly to an endpoint for "analysis" — without the tap there is no
; media, and without media there is no detection.
;
; [from-trunk]
; exten => _X.,1,NoOp(Inbound trunk call to ${EXTEN})
;  same => n,Stasis(voiceshield)
;  same => n,Dial(PJSIP/100,30)
;  same => n,Hangup()
