; VoiceShield — RTP port range (Asterisk 20 LTS defaults, explicit).
; NOTE: this range lives on the Asterisk host (WSL2/Docker). The VoiceShield
; gateway's own RTP ingress port (VFD_TELEPHONY_LOCAL_RTP_PORT, default 10000
; on the Windows host) is a DIFFERENT socket on a DIFFERENT host — no conflict.
; If both ever share a host, move the gateway port outside this range.

[general]
rtpstart = 10000
rtpend = 20000
icesupport = no
strictrtp = yes
