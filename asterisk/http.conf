; VoiceShield — embedded HTTP server for ARI + WebSocket events.
; Bind to the LAN/WSL interface Asterisk listens on; the VoiceShield gateway
; reaches this at http(s)://<asterisk-host>:8088/ari (see VFD_ASTERISK_ARI_URL).
; For production, terminate TLS in front (reverse proxy) and restrict bindaddr.

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
