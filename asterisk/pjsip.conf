; VoiceShield — PJSIP configuration (Asterisk 20 LTS, Ubuntu 24.04).
;
; Extensions 100 and 101 are real PJSIP endpoints. SIP passwords live ONLY
; in pjsip-secrets.conf, generated locally by scripts/setup-asterisk-wsl2.sh
; (0600, never committed). This file contains NO credentials.
;
; Media is forced through Asterisk (direct_media=no) so the VoiceShield tap
; (ARI snoop + externalMedia, see extensions.conf [internal]) always sees
; both directions. NAT traversal helpers are on (symmetric RTP / rport).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; --- Templates -----------------------------------------------------------

[endpoint-template](!)
type = endpoint
context = internal
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
device_state_busy_at = 1

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

; --- Extension 100 -------------------------------------------------------

[100](endpoint-template)
auth = auth100
aors = 100
callerid = Extension 100 <100>

[100](aor-template)

; --- Extension 101 -------------------------------------------------------

[101](endpoint-template)
auth = auth101
aors = 101
callerid = Extension 101 <101>

[101](aor-template)

; --- Future SIP-trunk identity (documentation only, disabled) -------------
; To attach a provider trunk later, define it here or in a separate
; provider.conf and point inbound DIDs at the [from-trunk] context in
; extensions.conf. Nothing below is active until uncommented AND backed by
; real provider credentials (see docs/telephony-setup.md).
;
; [trunk-provider](!)
; type = endpoint
; context = from-trunk
; disallow = all
; allow = ulaw,alaw
; direct_media = no
; rtp_symmetric = yes
; force_rport = yes
; rewrite_contact = yes
; auth = trunk-provider-auth
; aors = trunk-provider-aor
; ...

; --- Local secrets (generated on the Asterisk host, never in git) ---------
#include "pjsip-secrets.conf"
